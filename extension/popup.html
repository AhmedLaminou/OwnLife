<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>OwnLife</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="popup">
    <div class="brand"><img src="icons/icon-32.png" alt="" /> Own<span>Life</span></div>
    <div class="card">
      <div class="status"><span id="dot" class="dot"></span><span id="status">…</span></div>
    </div>
    <div class="card" id="noise-card" hidden>
      <div class="muted">Noise today, every source</div>
      <div class="noise-line"><span id="noise" class="big">—</span><span id="noise-budget" class="muted"></span></div>
      <div class="bar"><span id="noise-bar"></span></div>
      <div id="noise-cats"></div>
    </div>
    <div class="card">
      <div class="muted">Watched today on YouTube</div>
      <div id="today" class="big">—</div>
      <div id="channels"></div>
    </div>
    <div class="actions">
      <button id="open" class="primary">Open OwnLife</button>
      <button id="options">Settings</button>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
